[tool.pytest.ini_options]
# Tell pytest where to find tests
testpaths = ["tests"]

# asyncio_mode = "auto" means every async test function is automatically
# treated as an async test without needing @pytest.mark.asyncio on each one
asyncio_mode = "auto"

# Show extra test info: -v (verbose), -s (don't capture stdout)
addopts = "-v --tb=short"

# Minimum pytest version required
minversion = "8.0"
